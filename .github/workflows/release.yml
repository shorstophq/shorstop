name: release

# Runs when a version tag is pushed: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

# Nothing by default; the job asks for exactly what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload its files
      id-token: write # keyless cosign signing: a short-lived Sigstore certificate via OIDC
      packages: write # push the image to ghcr.io/shorstophq/shorstop
    steps:
      # Pinned to full commit SHAs: this job can publish releases, so it must
      # run exactly the code that was reviewed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs the history

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A release is only made from code that passes its tests.
      - run: go vet ./...
      - run: go test -race ./...

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # Multi-platform image builds (linux/amd64 and linux/arm64) and the
      # registry login. No QEMU: the Dockerfile has no RUN step, so nothing
      # arm64 executes during the build. The workflow's own token can push
      # to this repository's packages; no stored secret is needed.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token, write access to shorstophq/homebrew-tap only.
          # While the secret doesn't exist this is empty and the tap is skipped.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

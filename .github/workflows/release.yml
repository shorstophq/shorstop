name: release

# Runs when a version tag is pushed: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    # Version tags only (v0.1.0, v0.1.0-rc.1), so a moving major tag such as
    # v1 for the Action never starts a release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# Nothing by default; the job asks for exactly what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload its files
      id-token: write # keyless cosign signing: a short-lived Sigstore certificate via OIDC
      packages: write # push the image to ghcr.io/shorstophq/shorstop
    steps:
      # Pinned to full commit SHAs: this job can publish releases, so it must
      # run exactly the code that was reviewed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs the history

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # A release is only made from code that passes its tests.
      - run: go vet ./...
      - run: go test -race ./...

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # Multi-platform image builds (linux/amd64 and linux/arm64) and the
      # registry login. No QEMU: the Dockerfile has no RUN step, so nothing
      # arm64 executes during the build. The workflow's own token can push
      # to this repository's packages; no stored secret is needed.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token, write access to shorstophq/homebrew-tap only.
          # While the secret doesn't exist this is empty and the tap is skipped.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

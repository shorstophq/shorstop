# Builds the docs site (site/, Hugo + Hextra) and deploys it to GitHub Pages:
# https://shorstophq.github.io/shorstop/
#
# Pull requests only build it, so a broken page or link fails before merge.
# Pushes to main build and deploy. The rules reference is generated from the
# rule pack in the same commit, so it can't drift from the code.
name: pages
on:
  push:
    branches: [main]
    paths: &paths
      - site/**
      - scripts/rulesdoc/**
      - internal/rules/**
      - internal/detect/cert/**
      - internal/detect/config/**
      - docs/demo.gif
      - .github/workflows/pages.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one
# that's halfway through publishing.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.170.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history: each page's lastmod comes from git
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Hugo from its release, checked against the release's checksums,
      # rather than a third-party setup action.
      - name: Install Hugo
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${tarball}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Generate the rules reference
        run: go run ./scripts/rulesdoc > site/content/docs/rules.md

      - name: Build
        run: hugo --source site --gc --minify --panicOnWarning

      - name: Upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish to GitHub Pages
      id-token: write   # prove the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

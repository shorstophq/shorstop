      examples: ['Digest::MD5.hexdigest(s)', 'OpenSSL::Digest::MD5.new']

  - id: rb-digest-sha1
    description: Hashes with SHA-1 in Ruby; SHA-1 is broken today.
    detector: regex
    languages: [ruby]
    algorithm: SHA-1
    primitive: hash

    match:
      keywords: [openssl::pkey::ec]
      pattern: '\bOpenSSL::PKey::EC\b'
      examples: ['key = OpenSSL::PKey::EC.generate("prime256v1")']

  - id: rb-openssl-dsa
    description: Uses a DSA key with Ruby OpenSSL; DSA is broken by Shor's algorithm.
    detector: regex

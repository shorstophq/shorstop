      examples: ['EVP_DigestInit_ex(ctx, EVP_sha1(), NULL);']

  # ---------- Rust ----------
  - id: rs-rsa
    description: Generates an RSA key with the rsa crate; the key size is read when on the same line.
    detector: regex
    languages: [rust]
    algorithm: RSA
    match:
      keywords: [rsaprivatekey]
      pattern: '\bRsaPrivateKey::new\((?:[^,]*,\s*(?P<bits>\d+))?'
      examples: ['let key = RsaPrivateKey::new(&mut rng, 2048)?;']

  - id: rs-ed25519-dalek
    description: Uses the ed25519-dalek crate; EdDSA is broken by Shor's algorithm.
    detector: regex
    languages: [rust]
    algorithm: EdDSA
    primitive: signature
    key_size: 255
    match:
      keywords: [ed25519_dalek]
      pattern: '\bed25519_dalek\b'
      examples: ['use ed25519_dalek::SigningKey;']

  - id: rs-x25519-dalek
    description: Uses the x25519-dalek crate; X25519 is broken by Shor's algorithm.

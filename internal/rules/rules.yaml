      pattern: '\bOpenSSL::PKey::RSA\.(?:new|generate)\(\s*(?P<bits>\d+)?'
      examples: ['key = OpenSSL::PKey::RSA.new(2048)']

  - id: rb-openssl-ec
    description: Uses an EC key with Ruby OpenSSL; elliptic curves are broken by Shor's algorithm.
    detector: regex

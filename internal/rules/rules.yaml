  # ---------- C and C++ (OpenSSL) ----------
  - id: c-openssl-rsa-generate-key
    description: Generates an RSA key with the legacy OpenSSL API; the key size is read from the call.
    detector: regex
    languages: [c, cpp]
    algorithm: RSA
    match:
      keywords: [rsa_generate_key]
      pattern: '\bRSA_generate_key\((?:\s*(?P<bits>\d+))?'
      examples: ['RSA *r = RSA_generate_key(1024, RSA_F4, NULL, NULL);']

  - id: c-openssl-rsa-generate-key-ex
    description: Generates an RSA key with OpenSSL RSA_generate_key_ex; the key size is read from the call.
    detector: regex
    languages: [c, cpp]
    algorithm: RSA
    match:
      keywords: [rsa_generate_key_ex]
      pattern: '\bRSA_generate_key_ex\((?:\s*[^,]+,\s*(?P<bits>\d+))?'
      examples: ['RSA_generate_key_ex(rsa, 2048, e, NULL);']

  - id: c-openssl-pkey-rsa
    description: Uses an OpenSSL EVP_PKEY_RSA key; RSA is broken by Shor's algorithm.
    detector: regex
    languages: [c, cpp]
    algorithm: RSA
    match:
      keywords: [evp_pkey_rsa]
      pattern: '\bEVP_PKEY_RSA(?:_PSS)?\b'
      examples: ['EVP_PKEY_CTX_new_id(EVP_PKEY_RSA, NULL);']

  - id: c-openssl-pkey-ec
    description: Uses an OpenSSL EVP_PKEY_EC key; elliptic curves are broken by Shor's algorithm.
    detector: regex
    languages: [c, cpp]
    algorithm: ECC
    match:
      keywords: [evp_pkey_ec]
      pattern: '\bEVP_PKEY_EC\b'
      examples: ['EVP_PKEY_CTX_new_id(EVP_PKEY_EC, NULL);']

  - id: c-openssl-pkey-ed25519
    description: Uses an OpenSSL Ed25519 key; EdDSA is broken by Shor's algorithm.
    detector: regex
    languages: [c, cpp]
    algorithm: EdDSA
    primitive: signature
    key_size: 255
    match:
      keywords: [evp_pkey_ed25519]
      pattern: '\bEVP_PKEY_ED25519\b'
      examples: ['EVP_PKEY_CTX_new_id(EVP_PKEY_ED25519, NULL);']

  - id: c-openssl-pkey-x25519
    description: Uses an OpenSSL X25519 key; broken by Shor's algorithm.
    detector: regex
    languages: [c, cpp]
    algorithm: X25519
    primitive: key-agree
    key_size: 255
    match:
      keywords: [evp_pkey_x25519]
      pattern: '\bEVP_PKEY_X25519\b'
      examples: ['EVP_PKEY_CTX_new_id(EVP_PKEY_X25519, NULL);']

  - id: c-openssl-pkey-dh
    description: Uses an OpenSSL Diffie-Hellman key; broken by Shor's algorithm.
    detector: regex
    languages: [c, cpp]
    algorithm: DH
    primitive: key-agree
    match:
      keywords: [evp_pkey_dh]
      pattern: '\bEVP_PKEY_DH\b'
      examples: ['EVP_PKEY_CTX_new_id(EVP_PKEY_DH, NULL);']

  - id: c-openssl-pkey-dsa
    description: Uses an OpenSSL DSA key; DSA is broken by Shor's algorithm.
    detector: regex
    languages: [c, cpp]
    algorithm: DSA
    primitive: signature
    match:
      keywords: [evp_pkey_dsa]
      pattern: '\bEVP_PKEY_DSA\b'
      examples: ['EVP_PKEY_CTX_new_id(EVP_PKEY_DSA, NULL);']

  - id: c-openssl-evp-aes
    description: Uses an OpenSSL AES cipher; key size and mode are read from the function name.
    detector: regex
    languages: [c, cpp]
    algorithm: AES
    primitive: block-cipher
    match:
      keywords: [evp_aes_]
      pattern: '\bEVP_aes_(?P<bits>128|192|256)_(?P<mode>ecb|cbc|ctr|gcm|ofb|ccm|xts|ocb|cfb)'
      examples: ['EVP_EncryptInit_ex(ctx, EVP_aes_128_ecb(), NULL, key, NULL);', 'EVP_aes_256_cfb128()']

  - id: c-openssl-evp-des
    description: Uses an OpenSSL single-DES cipher; DES is broken today.
    detector: regex
    languages: [c, cpp]
    algorithm: DES
    primitive: block-cipher
    key_size: 56
    match:
      keywords: [evp_des_]
      pattern: '\bEVP_des_(?:ecb|cbc|cfb|ofb)'
      examples: ['EVP_des_cbc()']

  - id: c-openssl-evp-3des
    description: Uses an OpenSSL 3DES cipher; 3DES is broken today.
    detector: regex
    languages: [c, cpp]
    algorithm: 3DES
    primitive: block-cipher
    key_size: 168
    match:
      keywords: [evp_des_ede3]
      pattern: '\bEVP_des_ede3'
      examples: ['EVP_des_ede3_cbc()']

  - id: c-openssl-evp-rc4
    description: Uses the OpenSSL RC4 cipher; RC4 is broken today.
    detector: regex
    languages: [c, cpp]
    algorithm: RC4
    primitive: stream-cipher
    match:
      keywords: [evp_rc4]
      pattern: '\bEVP_rc4\b'
      examples: ['EVP_EncryptInit_ex(ctx, EVP_rc4(), NULL, key, NULL);']

  - id: c-openssl-md5
    description: Hashes with MD5 through OpenSSL; MD5 is broken today.
    detector: regex
    languages: [c, cpp]
    algorithm: MD5
    primitive: hash
    match:
      keywords: [md5]
      pattern: '\b(?:EVP_md5|MD5_Init|MD5)\('
      examples: ['EVP_DigestInit_ex(ctx, EVP_md5(), NULL);', 'MD5(data, len, out);']

  - id: c-openssl-sha1
    description: Hashes with SHA-1 through OpenSSL; SHA-1 is broken today.
    detector: regex

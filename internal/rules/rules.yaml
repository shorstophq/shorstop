# ShorStop built-in rule pack. Format documented in rules.go (type Rule).
# Rule IDs appear in reports and in `// shorstop:ignore <rule-id>` comments,
# so never rename or reuse one; retire it and add a new ID instead.
version: 1

rules:
  # ---------- Go standard library: public-key (quantum-vulnerable) ----------
  - id: go-rsa-import
    description: Imports crypto/rsa; RSA is broken by Shor's algorithm.
    detector: goast
    algorithm: RSA
    match: { import: crypto/rsa }

  - id: go-rsa-generate-key
    description: Generates an RSA key; the key size is read from the call.
    detector: goast
    algorithm: RSA
    match: { import: crypto/rsa, call: GenerateKey, key_size_arg: 1 }

  - id: go-dsa-import
    description: Imports crypto/dsa; DSA is broken by Shor's algorithm and deprecated in Go.
    detector: goast
    algorithm: DSA
    primitive: signature
    match: { import: crypto/dsa }

  - id: go-ecdsa-import
    description: Imports crypto/ecdsa; ECDSA is broken by Shor's algorithm.
    detector: goast
    algorithm: ECDSA
    primitive: signature
    match: { import: crypto/ecdsa }

  - id: go-ecdh-import
    description: Imports crypto/ecdh; elliptic-curve key agreement is broken by Shor's algorithm.
    detector: goast
    algorithm: ECDH
    primitive: key-agree
    match: { import: crypto/ecdh }

  - id: go-ecdh-x25519
    description: Uses X25519 key agreement; broken by Shor's algorithm.
    detector: goast
    algorithm: X25519
    primitive: key-agree
    key_size: 255
    match: { import: crypto/ecdh, call: X25519 }

  - id: go-elliptic-import
    description: Imports crypto/elliptic, the low-level curve package behind ECDSA and ECDH.
    detector: goast
    algorithm: ECC
    match: { import: crypto/elliptic }

  - id: go-ed25519-import
    description: Imports crypto/ed25519; EdDSA is broken by Shor's algorithm.
    detector: goast
    algorithm: EdDSA
    primitive: signature
    key_size: 255
    match: { import: crypto/ed25519 }

  - id: go-x-ed25519-import
    description: Imports golang.org/x/crypto/ed25519; EdDSA is broken by Shor's algorithm.
    detector: goast
    algorithm: EdDSA
    primitive: signature
    key_size: 255
    match: { import: golang.org/x/crypto/ed25519 }

  - id: go-x-curve25519-import
    description: Imports golang.org/x/crypto/curve25519; X25519 is broken by Shor's algorithm.
    detector: goast
    algorithm: X25519
    primitive: key-agree
    key_size: 255
    match: { import: golang.org/x/crypto/curve25519 }

  # ---------- Go standard library: post-quantum (quantum-safe) ----------
  - id: go-mlkem-import
    description: Imports crypto/mlkem, the NIST FIPS 203 post-quantum KEM.
    detector: goast
    algorithm: ML-KEM
    primitive: kem
    match: { import: crypto/mlkem }

  - id: go-mldsa-import
    description: Imports crypto/mldsa, the NIST FIPS 204 post-quantum signature scheme.
    detector: goast
    algorithm: ML-DSA
    primitive: signature
    match: { import: crypto/mldsa }

  # ---------- Go: symmetric ciphers ----------
  - id: go-aes-import
    description: Imports crypto/aes; the key size decides whether it is weakened by Grover's algorithm.
    detector: goast
    algorithm: AES
    primitive: block-cipher
    match: { import: crypto/aes }

  - id: go-des-import
    description: Imports crypto/des; DES is broken today.
    detector: goast
    algorithm: DES
    primitive: block-cipher
    key_size: 56
    match: { import: crypto/des }

  - id: go-des-triple
    description: Creates a 3DES cipher; 3DES is broken today (64-bit block, Sweet32).
    detector: goast
    algorithm: 3DES
    primitive: block-cipher
    key_size: 168
    match: { import: crypto/des, call: NewTripleDESCipher }

  - id: go-rc4-import
    description: Imports crypto/rc4; RC4 is broken today.
    detector: goast
    algorithm: RC4
    primitive: stream-cipher
    match: { import: crypto/rc4 }

  # ---------- Go: hashes ----------
  - id: go-md5-import
    description: Imports crypto/md5; MD5 is broken today.
    detector: goast
    algorithm: MD5
    primitive: hash
    match: { import: crypto/md5 }

  - id: go-sha1-import
    description: Imports crypto/sha1; SHA-1 is broken today.
    detector: goast
    algorithm: SHA-1
    primitive: hash
    match: { import: crypto/sha1 }

  - id: go-x-md4-import
    description: Imports golang.org/x/crypto/md4; MD4 is broken today.
    detector: goast
    algorithm: MD4
    primitive: hash
    match: { import: golang.org/x/crypto/md4 }

  - id: go-sha256-import
    description: Imports crypto/sha256; acceptable, listed for the CBOM inventory.
    detector: goast
    algorithm: SHA-256
    primitive: hash
    match: { import: crypto/sha256 }

  - id: go-sha512-import
    description: Imports crypto/sha512; acceptable, listed for the CBOM inventory.
    detector: goast
    algorithm: SHA-512
    primitive: hash
    match: { import: crypto/sha512 }

  - id: go-sha3-import
    description: Imports crypto/sha3; acceptable, listed for the CBOM inventory.
    detector: goast
    algorithm: SHA-3
    primitive: hash
    match: { import: crypto/sha3 }

  # =====================================================================
  # Regex rules. Patterns are RE2, matched line by line, comments included.
  # A pattern runs only on files containing one of its keywords
  # (case-insensitive), and every example must match at load time.
  # Rules without `languages` run on every text file, Go included.
  # =====================================================================

  # ---------- Any language: algorithm and cipher-suite names ----------
  - id: generic-aes-cipher-string
    description: An AES cipher name with key size and mode, such as aes-256-cbc (OpenSSL, Node, PHP, Ruby, configs).
    detector: regex
    algorithm: AES
    primitive: block-cipher
    match:
      keywords: [aes]
      # (?:^|[^!\w]) instead of \b: "!AES128-CBC" in a cipher string disables it.
      pattern: '(?i)(?:^|[^!\w])aes[-_]?(?P<bits>128|192|256)[-_]?(?P<mode>ecb|cbc|ctr|gcm|cfb|ofb|ccm|xts|ocb)\b'
      examples: ['openssl enc -aes-256-cbc -in secret.txt', 'crypto.createCipheriv(''aes-128-ecb'', key, null)', 'CIPHER = "AES_128_GCM"', 'aes128-ctr']

  - id: generic-rsa-bits
    description: An RSA key-size string such as RSA-2048 or rsa:4096.
    detector: regex
    algorithm: RSA
    match:
      keywords: [rsa]
      pattern: '(?i)\brsa[-_:]?(?P<bits>1024|2048|3072|4096|8192)\b'
      examples: ['openssl req -newkey rsa:2048 -nodes', 'KEY_TYPE=RSA-4096']

  - id: generic-3des
    description: A 3DES cipher name; 3DES is broken today (64-bit block, Sweet32).
    detector: regex
    algorithm: 3DES
    primitive: block-cipher
    key_size: 168
    match:
      keywords: [des-ede3, des-cbc3, 3des, tripledes, triple-des, desede]
      # (?:^|[^!\w]) instead of \b: "!3DES" in a cipher string disables it.
      pattern: '(?i)(?:^|[^!\w])(?:des-ede3(?:-cbc)?|des-cbc3|3des|triple-?des|desede)\b'
      examples: ['openssl enc -des-ede3-cbc', 'algorithm: TripleDES', 'ssh -c 3des-cbc host', 'ssl_ciphers DES-CBC3-SHA;', '3DES']

  - id: generic-rc4
    description: An RC4 cipher name in quotes; RC4 is broken today.
    detector: regex
    algorithm: RC4
    primitive: stream-cipher
    match:
      keywords: [rc4, arcfour]
      pattern: '(?i)[''"](?:rc4|arcfour)(?:-(?:40|56|64|128|hmac-md5))?[''"]'
      examples: ['crypto.createCipheriv(''rc4'', key, '''')', 'OpenSSL::Cipher.new("RC4-40")']

  - id: generic-mlkem-name
    description: An ML-KEM parameter-set name, such as ML-KEM-768 (NIST FIPS 203, quantum-safe).
    detector: regex
    algorithm: ML-KEM
    primitive: kem
    match:
      keywords: [mlkem, ml-kem]
      pattern: '(?i)\bML-?KEM-?(?:512|768|1024)\b'
      examples: ['EVP_PKEY_CTX_new_from_name(NULL, "ML-KEM-768", NULL)', 'kem = "mlkem1024"']

  - id: generic-mldsa-name
    description: An ML-DSA parameter-set name, such as ML-DSA-65 (NIST FIPS 204, quantum-safe).
    detector: regex
    algorithm: ML-DSA
    primitive: signature
    match:
      keywords: [mldsa, ml-dsa]
      pattern: '(?i)\bML-?DSA-?(?:44|65|87)\b'
      examples: ['openssl genpkey -algorithm ML-DSA-65', 'sig_alg: mldsa87']

  - id: generic-x25519mlkem768
    description: The hybrid X25519MLKEM768 TLS key-exchange group (quantum-safe).
    detector: regex
    algorithm: ML-KEM
    primitive: kem
    match:
      keywords: [x25519mlkem768]
      pattern: '(?i)\bX25519MLKEM768\b'
      examples: ['ssl_ecdh_curve X25519MLKEM768:X25519;']

  - id: generic-ssh-mlkem-kex
    description: The hybrid mlkem768x25519-sha256 SSH key exchange (quantum-safe).
    detector: regex
    algorithm: ML-KEM
    primitive: kem
    match:
      keywords: [mlkem768x25519]
      pattern: '(?i)\bmlkem768x25519-sha256\b'
      examples: ['KexAlgorithms mlkem768x25519-sha256,curve25519-sha256']

  # ---------- Any language: shell commands (Dockerfiles, CI scripts, Makefiles, docs) ----------
  - id: generic-openssl-genrsa
    description: Generates an RSA key with openssl genrsa; the key size is read when given.
    detector: regex
    algorithm: RSA
    match:
      keywords: [genrsa]
      pattern: '(?i)\bopenssl\s+genrsa\b(?:[^|;&]*\s(?P<bits>512|768|1024|2048|3072|4096|8192)\b)?'
      examples: ['RUN openssl genrsa -out server.key 2048', 'openssl genrsa > key.pem']

  - id: generic-openssl-genpkey-rsa
    description: Generates an RSA key with openssl genpkey; the key size is read from rsa_keygen_bits.
    detector: regex
    algorithm: RSA
    match:
      keywords: [genpkey]
      pattern: '(?i)\bopenssl\s+genpkey\b[^|;&]*-algorithm\s+RSA\b(?:[^|;&]*rsa_keygen_bits:(?P<bits>\d+))?'
      examples: ['openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out k.pem']

  - id: generic-openssl-genpkey-ec
    description: Generates an elliptic-curve key with openssl genpkey; broken by Shor's algorithm.
    detector: regex
    algorithm: ECC
    match:
      keywords: [genpkey]
      pattern: '(?i)\bopenssl\s+genpkey\b[^|;&]*-algorithm\s+EC\b'
      examples: ['openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256']

  - id: generic-openssl-genpkey-ed25519
    description: Generates an Ed25519 key with openssl genpkey; EdDSA is broken by Shor's algorithm.
    detector: regex
    algorithm: EdDSA
    primitive: signature
    key_size: 255
    match:
      keywords: [genpkey]
      pattern: '(?i)\bopenssl\s+genpkey\b[^|;&]*-algorithm\s+ED25519\b'
      examples: ['openssl genpkey -algorithm ed25519 -out ed.pem']

  - id: generic-openssl-genpkey-x25519
    description: Generates an X25519 key with openssl genpkey; broken by Shor's algorithm.
    detector: regex
    algorithm: X25519
    primitive: key-agree
    key_size: 255
    match:
      keywords: [genpkey]
      pattern: '(?i)\bopenssl\s+genpkey\b[^|;&]*-algorithm\s+X25519\b'
      examples: ['openssl genpkey -algorithm X25519 -out x.pem']

  - id: generic-openssl-ecparam
    description: Generates or uses elliptic-curve parameters with openssl ecparam; broken by Shor's algorithm.
    detector: regex
    algorithm: ECC
    match:
      keywords: [ecparam]
      pattern: '(?i)\bopenssl\s+ecparam\b'
      examples: ['openssl ecparam -name prime256v1 -genkey -noout -out ec.key']

  - id: generic-openssl-dhparam
    description: Generates Diffie-Hellman parameters with openssl dhparam; the size is read when given.
    detector: regex
    algorithm: DH
    primitive: key-agree
    match:
      keywords: [dhparam]
      pattern: '(?i)\bopenssl\s+dhparam\b(?:[^|;&]*\s(?P<bits>1024|2048|3072|4096|8192)\b)?'
      examples: ['RUN openssl dhparam -out /etc/nginx/dhparam.pem 2048']

  - id: generic-openssl-md5
    description: Hashes or signs with MD5 through the openssl command; MD5 is broken today.
    detector: regex
    algorithm: MD5
    primitive: hash
    match:
      keywords: [md5]
      pattern: '(?i)\bopenssl\s+(?:md5\b|(?:dgst|req|x509|ca|smime|cms)\b[^|;&]*\s-md5\b)'
      examples: ['openssl dgst -md5 file.bin', 'openssl md5 file.bin', 'openssl req -new -md5 -key k.pem']

  - id: generic-openssl-sha1
    description: Hashes or signs with SHA-1 through the openssl command; SHA-1 is broken today.
    detector: regex
    algorithm: SHA-1
    primitive: hash
    match:
      keywords: [sha1]
      pattern: '(?i)\bopenssl\s+(?:sha1\b|(?:dgst|req|x509|ca|smime|cms)\b[^|;&]*\s-sha1\b)'
      examples: ['openssl req -x509 -sha1 -newkey rsa:1024', 'openssl dgst -sha1 -sign k.pem f']

  - id: generic-ssh-keygen-rsa
    description: Generates an RSA SSH key; the size is read when -b follows -t.
    detector: regex
    algorithm: RSA
    match:
      keywords: [ssh-keygen]
      pattern: '\bssh-keygen\b[^|;&]*\s-t\s*rsa\b(?:[^|;&]*\s-b\s*(?P<bits>\d+))?'
      examples: ['RUN ssh-keygen -t rsa -b 4096 -N "" -f /root/.ssh/id_rsa', 'ssh-keygen -q -t rsa']

  - id: generic-ssh-keygen-dsa
    description: Generates a DSA SSH key; DSA is broken by Shor's algorithm and removed from OpenSSH.
    detector: regex
    algorithm: DSA
    primitive: signature
    match:
      keywords: [ssh-keygen]
      pattern: '\bssh-keygen\b[^|;&]*\s-t\s*dsa\b'
      examples: ['ssh-keygen -t dsa -f key']

  - id: generic-ssh-keygen-ecdsa
    description: Generates an ECDSA SSH key; the size is read when -b follows -t.
    detector: regex
    algorithm: ECDSA
    primitive: signature
    match:
      keywords: [ssh-keygen]
      pattern: '\bssh-keygen\b[^|;&]*\s-t\s*ecdsa\b(?:[^|;&]*\s-b\s*(?P<bits>256|384|521))?'
      examples: ['ssh-keygen -t ecdsa -b 384 -f key']

  - id: generic-ssh-keygen-ed25519
    description: Generates an Ed25519 SSH key; EdDSA is broken by Shor's algorithm.
    detector: regex
    algorithm: EdDSA
    primitive: signature
    key_size: 255
    match:
      keywords: [ssh-keygen]
      pattern: '\bssh-keygen\b[^|;&]*\s-t\s*ed25519\b'
      examples: ['ssh-keygen -t ed25519 -C "me@example.com"', 'ssh-keygen -t ed25519-sk']

  # ---------- Python ----------
  - id: py-pycryptodome-rsa
    description: Imports RSA from PyCryptodome; RSA is broken by Shor's algorithm.
    detector: regex
    languages: [python]
    algorithm: RSA
    match:
      keywords: [publickey]
      pattern: '\bCrypto(?:dome)?\.PublicKey(?:\.RSA\b|\s+import\s+(?:.*[\s,(])?RSA\b)'
      examples: ['from Crypto.PublicKey import RSA', 'from Cryptodome.PublicKey import DSA, RSA', 'import Crypto.PublicKey.RSA']

  - id: py-pycryptodome-dsa
    description: Imports DSA from PyCryptodome; DSA is broken by Shor's algorithm.
    detector: regex
    languages: [python]
    algorithm: DSA
    primitive: signature
    match:
      keywords: [publickey]
      pattern: '\bCrypto(?:dome)?\.PublicKey(?:\.DSA\b|\s+import\s+(?:.*[\s,(])?DSA\b)'
      examples: ['from Crypto.PublicKey import DSA']

  - id: py-pycryptodome-ecc
    description: Imports ECC from PyCryptodome; elliptic curves are broken by Shor's algorithm.
    detector: regex
    languages: [python]
    algorithm: ECC
    match:
      keywords: [publickey]
      pattern: '\bCrypto(?:dome)?\.PublicKey(?:\.ECC\b|\s+import\s+(?:.*[\s,(])?ECC\b)'
      examples: ['from Crypto.PublicKey import ECC']

  - id: py-pycryptodome-rsa-generate
    description: Generates an RSA key with PyCryptodome; the key size is read from the call.
    detector: regex
    languages: [python]
    algorithm: RSA
    match:
      keywords: [rsa.generate]
      pattern: '\bRSA\.generate\(\s*(?P<bits>\d+)'
      examples: ['key = RSA.generate(2048)']

  - id: py-pycryptodome-des
    description: Imports DES from PyCryptodome; DES is broken today.
    detector: regex
    languages: [python]
    algorithm: DES
    primitive: block-cipher
    key_size: 56
    match:
      keywords: [cipher]
      pattern: '\bCrypto(?:dome)?\.Cipher(?:\.DES\b|\s+import\s+(?:.*[\s,(])?DES\b)'
      examples: ['from Crypto.Cipher import DES']

  - id: py-pycryptodome-3des
    description: Imports DES3 from PyCryptodome; 3DES is broken today.
    detector: regex
    languages: [python]
    algorithm: 3DES
    primitive: block-cipher
    key_size: 168
    match:
      keywords: [cipher]
      pattern: '\bCrypto(?:dome)?\.Cipher(?:\.DES3\b|\s+import\s+(?:.*[\s,(])?DES3\b)'
      examples: ['from Crypto.Cipher import AES, DES3']

  - id: py-pycryptodome-arc4
    description: Imports ARC4 from PyCryptodome; RC4 is broken today.
    detector: regex
    languages: [python]
    algorithm: RC4
    primitive: stream-cipher
    match:
      keywords: [cipher]
      pattern: '\bCrypto(?:dome)?\.Cipher(?:\.ARC4\b|\s+import\s+(?:.*[\s,(])?ARC4\b)'
      examples: ['from Crypto.Cipher import ARC4']

  - id: py-pycryptodome-aes-mode
    description: Creates a PyCryptodome AES cipher; the mode is read from the call.
    detector: regex
    languages: [python]
    algorithm: AES
    primitive: block-cipher
    match:
      keywords: [aes.mode_]
      pattern: '\bAES\.MODE_(?P<mode>[A-Z]+)\b'
      examples: ['cipher = AES.new(key, AES.MODE_ECB)', 'AES.new(key, AES.MODE_GCM, nonce=n)']

  - id: py-hashlib-md5
    description: Hashes with MD5 through hashlib; MD5 is broken today.
    detector: regex
    languages: [python]
    algorithm: MD5
    primitive: hash
    match:
      keywords: [hashlib]
      pattern: '\bhashlib\.(?:md5\b|new\(\s*[''"]md5[''"])'
      examples: ['digest = hashlib.md5(data).hexdigest()', 'h = hashlib.new(''md5'')']

  - id: py-hashlib-sha1
    description: Hashes with SHA-1 through hashlib; SHA-1 is broken today.
    detector: regex
    languages: [python]
    algorithm: SHA-1
    primitive: hash
    match:
      keywords: [hashlib]
      pattern: '\bhashlib\.(?:sha1\b|new\(\s*[''"]sha1[''"])'
      examples: ['hashlib.sha1(b"x")', 'hashlib.new("sha1")']

  - id: py-cryptography-rsa-generate
    description: Generates an RSA key with pyca/cryptography; the key size is read when it is on the same line.
    detector: regex
    languages: [python]
    algorithm: RSA
    match:
      keywords: [generate_private_key]
      pattern: '\brsa\.generate_private_key\((?:.*\bkey_size\s*=\s*(?P<bits>\d+))?'
      examples: ['rsa.generate_private_key(public_exponent=65537, key_size=2048)', 'key = rsa.generate_private_key(']

  - id: py-cryptography-ec-generate
    description: Generates an elliptic-curve key with pyca/cryptography; broken by Shor's algorithm.
    detector: regex
    languages: [python]
    algorithm: ECC
    match:
      keywords: [generate_private_key]
      pattern: '\bec\.generate_private_key\('
      examples: ['key = ec.generate_private_key(ec.SECP256R1())']

  - id: py-cryptography-ed25519
    description: Uses an Ed25519 private key from pyca/cryptography; EdDSA is broken by Shor's algorithm.
    detector: regex
    languages: [python]
    algorithm: EdDSA
    primitive: signature
    key_size: 255
    match:
      keywords: [ed25519privatekey]
      pattern: '\bEd25519PrivateKey\.(?:generate|from_private_bytes)\('
      examples: ['key = Ed25519PrivateKey.generate()']

  - id: py-cryptography-x25519
    description: Uses an X25519 private key from pyca/cryptography; broken by Shor's algorithm.
    detector: regex
    languages: [python]
    algorithm: X25519
    primitive: key-agree
    key_size: 255
    match:
      keywords: [x25519privatekey]
      pattern: '\bX25519PrivateKey\.(?:generate|from_private_bytes)\('
      examples: ['shared = X25519PrivateKey.generate()']

  - id: py-cryptography-dh
    description: Generates Diffie-Hellman parameters with pyca/cryptography; broken by Shor's algorithm.
    detector: regex
    languages: [python]
    algorithm: DH
    primitive: key-agree
    match:
      keywords: [generate_parameters]
      pattern: '\bdh\.generate_parameters\('
      examples: ['params = dh.generate_parameters(generator=2, key_size=2048)']

  - id: py-cryptography-3des
    description: Uses TripleDES from pyca/cryptography; 3DES is broken today.
    detector: regex
    languages: [python]
    algorithm: 3DES
    primitive: block-cipher
    key_size: 168
    match:
      keywords: [tripledes]
      pattern: '\balgorithms\.TripleDES\('
      examples: ['Cipher(algorithms.TripleDES(key), modes.CBC(iv))']

  - id: py-cryptography-arc4
    description: Uses ARC4 from pyca/cryptography; RC4 is broken today.
    detector: regex
    languages: [python]
    algorithm: RC4
    primitive: stream-cipher
    match:
      keywords: [arc4]
      pattern: '\balgorithms\.ARC4\('
      examples: ['Cipher(algorithms.ARC4(key), mode=None)']

  - id: py-cryptography-aes-ecb
    description: Uses AES in ECB mode from pyca/cryptography; ECB leaks patterns. Only when both are on one line, so the cipher is known.
    detector: regex
    languages: [python]
    algorithm: AES
    primitive: block-cipher
    mode: ECB
    match:
      keywords: [modes.ecb]
      pattern: '\balgorithms\.AES(?:128|256)?\(.*\bmodes\.ECB\('
      examples: ['Cipher(algorithms.AES(key), modes.ECB())']

  - id: py-cryptography-md5
    description: Hashes with MD5 through pyca/cryptography; MD5 is broken today.
    detector: regex
    languages: [python]
    algorithm: MD5
    primitive: hash
    match:
      keywords: [hashes.md5]
      pattern: '\bhashes\.MD5\('
      examples: ['hashes.Hash(hashes.MD5())']

  - id: py-cryptography-sha1
    description: Hashes with SHA-1 through pyca/cryptography; SHA-1 is broken today.
    detector: regex
    languages: [python]
    algorithm: SHA-1
    primitive: hash
    match:
      keywords: [hashes.sha1]
      pattern: '\bhashes\.SHA1\('
      examples: ['padding.PSS(mgf=padding.MGF1(hashes.SHA1()))']

  - id: py-rsa-newkeys
    description: Generates an RSA key with the python-rsa package; the key size is read from the call.
    detector: regex
    languages: [python]
    algorithm: RSA
    match:
      keywords: [newkeys]
      pattern: '\brsa\.newkeys\(\s*(?P<bits>\d+)'
      examples: ['(pub, priv) = rsa.newkeys(1024)']

  - id: py-oqs-mlkem
    description: Uses ML-KEM through liboqs-python (NIST FIPS 203, quantum-safe).
    detector: regex
    languages: [python]
    algorithm: ML-KEM
    primitive: kem
    match:
      keywords: [keyencapsulation]
      pattern: '\boqs\.KeyEncapsulation\(\s*[''"]ML-KEM'
      examples: ['with oqs.KeyEncapsulation("ML-KEM-768") as kem:']

  - id: py-oqs-mldsa
